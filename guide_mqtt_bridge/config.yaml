# guide_mqtt_bridge 配置（Linux 虚拟机）
# 与 beam_UAV_path_plan 独立，不修改仿真仓库。

mqtt:
  host: 192.168.70.62
  port: 1883
  keepalive: 30
  cmd_topic: beam_dubins/guide/cmd
  status_topic: beam_dubins/guide/status

ros:
  # 按虚拟机实际路径修改
  setup_shell: |
    source /opt/ros/noetic/setup.bash
    source ~/catkin_ws/devel/setup.bash
  launch_package: uav_guide
  launch_file: uav_guide.launch
  launch_match: "uav_guide.launch"
  waypoint_match: "mqtt_waypoint_bridge"

tmux:
  guide_session: uav_guide_launch
  waypoint_session: uav_waypoint_bridge

status:
  publish_hz: 1.0
