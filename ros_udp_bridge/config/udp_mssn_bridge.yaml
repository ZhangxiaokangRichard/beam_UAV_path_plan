# ═══════════════════════════════════════════════════════════════
# udp_mssn_bridge 配置（极简版）：距离判断发射许可 + 命中上报 + tmux 窗口
# ═══════════════════════════════════════════════════════════════

mission:
  check_hz: 10.0            # 距离判断循环频率（Hz）
  launch_dist_m: 7000.0     # uav-target 欧氏距离阈值（m）；< 该值允许发射

cmd:
  launch_cmd_topic: /uav/launch_cmd   # 发射许可话题（std_msgs/Bool，latch）
  crashed_topic: /target/crashed      # 命中判定话题（std_msgs/Bool）
  uav_state_topic: /uav/state         # uav 状态订阅
  target_state_topic: /target/state   # 目标状态订阅

  # ── 命中协议发送（crashed=true 时发含 target_key 的 JSON-UDP） ──
  remote_host: 10.119.228.21          # 发送目标（与 udp_sender 一致）
  remote_port: 9100                   # 发送端口
  target_key: "30064967681"           # 目标 key（命中协议 targetKey）

mssn:
  # 启动子进程前的 ROS 环境
  setup_shell: |
    source /opt/ros/noetic/setup.bash
    source ~/catkin_ws/devel/setup.bash

  # ── tmux 依次启动的两个独立窗口 ──
  uav_guide_launch: "roslaunch uav_guide uav_guide.launch"   # 主循环
  uav_bridge_launch: "roslaunch ros_udp_bridge uav_bridge.launch"  # udp_receiver + udp_sender
