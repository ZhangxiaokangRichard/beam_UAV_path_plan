# ═══════════════════════════════════════════════════════════════
# uav_guide 引导配置
# ═══════════════════════════════════════════════════════════════

inputs:
  uav_topic: /uav/state
  target_topic: /target/state

# 拦截模式：head-on | tail（启动默认；运行中可通过话题热切换）
intercept_mode: head-on
intercept_mode_topic: /uav_guide/intercept_mode_cmd
intercept_mode_status_topic: /uav_guide/intercept_mode

planning:
  service: /beam_dubins/plan_path
  frame_id: map
  time_limit_ms: 0.0
  use_3d: false

target:
  approach_distance_tail: 1500.0
  approach_distance_headon: 2300.0
  tracking_entry_dist: 2400.0
  tracking_window: 100.0
  divergence_threshold: 3
  velocity_align_deg: 70
  min_closure_m: 3.0          # head-on：每帧接近量 (m)
  min_closure_m_tail: 1.5     # tail：尾追相对接近较慢，阈值更低
  entry_hold_count: 1

# TRACKING 模式对外引导点偏移（飞控圆心盘旋，近似直飞目标）
finalshot:
  offset_m_t: 750
  offset_m: 50
  radius_m: 10.0

# 对接 uav_dynamic 服务时使用的水平速度模值
# （uav_dynamic 服务端 motion.speed_mps 为默认，此处可覆盖）
dynamics:
  speed_mps: 50.0

space:
  lx: 10000.0
  ly: 5000.0
  lz: 1000.0
  boundary_margin: 50.0

output:
  planned_path_topic: /uav/planned_path
  dynamics_cmd_topic: /uav/cmd

# 与 ros_udp_bridge geodesy 原点一致时的后备原点
geodesy:
  origin_latitude_deg: 34.01396246
  origin_longitude_deg: 116.92349937
  origin_altitude_m: 0.0
