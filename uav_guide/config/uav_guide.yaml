# ═══════════════════════════════════════════════════════════════
# uav_guide 配置（ROS2 Humble）：三个节点共用同一份参数
#   uav_guide_loop_node   → aoa/uav/planed_path
#   uav_guide_point_node  → aoa/uav/setpoint   （setpoint 制导）
#   uav_guidance_node     → aoa/uav/guidance   （cruise 制导）
# 取值来源：1.0.1 的 uav_guide/config/uav_guide.yaml（参数名保持一致）
# ═══════════════════════════════════════════════════════════════
/**:
  ros__parameters:
    # ── 输入 ──
    inputs:
      uav_topic: "aoa/uav/state"
      target_topic: "aoa/target/state"

    # ── 拦截模式（与 MQTT 模式 auto/setpoint/cruise 正交）──
    intercept_mode: "head-on"
    intercept_mode_topic: "aoa/uav/intercept_mode_cmd"
    intercept_mode_status_topic: "aoa/uav/intercept_mode"

    # ── 规划 ──
    planning:
      service: "aoa/beam_dubins/plan_path"
      frame_id: "map"
      time_limit_ms: 0.0
      use_3d: false

    # ── APPROACH / TRACKING 判据（与 1.0.1 一致）──
    target:
      approach_distance_tail: 1500.0
      approach_distance_headon: 2300.0
      tracking_entry_dist: 2400.0
      tracking_window: 100.0
      divergence_threshold: 3
      velocity_align_deg: 70.0
      min_closure_m: 3.0
      min_closure_m_tail: 1.5
      entry_hold_count: 1

    # ── 偏移引导点（无剩余弧段时）──
    finalshot:
      offset_m_t: 750.0
      offset_m: 50.0
      radius_m: 10.0

    # ── 路径切分 ──
    segmentation:
      curvature_eps: 0.0001
      yaw_segment_eps: 0.03
      default_turn_radius_m: 500.0

    # ── 规划空间 ──
    space:
      lx: 10000.0
      ly: 5000.0
      lz: 1000.0
      boundary_margin: 50.0

    # ── 指点制导输出（uav_guide_point_node）──
    guide_point:
      topic: "aoa/uav/setpoint"
      frame_id: "wgs84"
      publish_rate_hz: 5.0

    # ── 巡航制导输出（uav_guidance_node）──
    # 采样点 = 自本机沿 planed_path 起"首个曲率为 0 的点"（Q12/Q16 裁决）
    guidance:
      topic: "aoa/uav/guidance"
      curvature_eps: 0.0001
      fly_speed_mps: 50.0            # 常量占位（后续可接 set_fly_speed）
      # 严格按该周期发布（单一定时器，无“变化触发”补发）→ mqtt_control_bridge 1:1 透传
      publish_rate_hz: 5.0
      sample_rule: "first_zero_curvature"     # | first_nonzero_curvature
      heads_source: "sample_yaw"              # | bearing_to_sample
      height_source: "sample_point_z"         # | target_z
      # pose_source：本机位姿来源。
      #   topic = 直接用 aoa/uav/state（**现场推荐**：无 TF 依赖，SN 变化无需改配置）
      #   tf2   = 查 map→uav_frame；需把 uav_frame 设为 mqtt_target_bridge 广播的
      #           子帧名（即飞机 SN，如 V2.4AOACRAFT-NOCONF0），否则每秒 WARN 并回落 topic
      pose_source: "topic"                    # | tf2
      map_frame: "map"
      uav_frame: "aoa/uav_base_link"          # 仅 pose_source=tf2 时生效

    # ── 输出（观测话题）──
    output:
      planed_path_topic: "aoa/uav/planed_path"
      tracking_mode_topic: "aoa/uav/tracking_mode"

    # ── 地理原点（**必须与 ros_mqtt_bridge/config/mqtt_bridge.yaml 的 geodesy.* 完全一致**）──
    # 不一致会导致 fly_point 经纬度整体偏移（ENU→WGS84 反算错误），实测教训：差 5.4 km。
    # 现场标定值（2026-09-18）：
    geodesy:
      origin_latitude_deg: 31.5959681
      origin_longitude_deg: 104.9380182
      origin_altitude_m: 100.0
