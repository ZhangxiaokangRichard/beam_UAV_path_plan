# ═══════════════════════════════════════════════════════════════
# uav_dynamic 运动解算参数（阶段 4-7 整定）
# ═══════════════════════════════════════════════════════════════

motion:
  speed_mps: 50.0           # 水平速度模值（定速巡航，DWA 只改航向不改速度）
  min_turn_radius_m: 500.0  # 最小转弯半径（协调转弯律参量）
  bank_angle_max_deg: 25.0  # 滚转角限幅（±25°）
  g: 9.81                   # 重力加速度
  lookahead_m: 100.0        # 水平前视距离（取路径期望点）

dwa:
  sample_num: 21            # DWA 航向采样数
  sample_window_rad: 0.2    # 采样窗口（±rad）
  roll_weight: 0.2          # 滚转惩罚（仅轻微平滑，保证航向收敛到期望、误差最小）

vertical:
  kp: 0.6                   # 高度误差 P 增益（kp>0, ki>0 → 纵向渐近稳定）
  ki: 0.02                  # 高度误差 I 增益（小值：消除稳态误差，避免积分堆满限幅超调）
  climb_vel_limit_mps: 3.0  # 垂直速度限幅（±3 m/s）
  alpha_limit_deg: 30.0     # 迎角（俯仰）限幅（±30°）
  alpha_gain: 0.175         # =30°/3m/s：climb 限幅内迎角线性对应，不提前饱和
  integral_limit: 8.0       # 积分限幅（配合 anti-windup 防超调）
  solve_hz: 20.0            # 服务调用节拍（积分 dt）

# 指令平滑（阶段 7：控制状态/姿态角变化连续）
smooth:
  max_roll_rate_radps: 0.35     # 滚转指令变化率上限 (~20°/s)
  max_alpha_rate_radps: 0.35    # 迎角指令变化率上限 (~20°/s)
  max_climb_rate_mps2: 3.0      # 垂直速度指令变化率上限
