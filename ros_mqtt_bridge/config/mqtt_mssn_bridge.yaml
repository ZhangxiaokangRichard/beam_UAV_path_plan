# ═══════════════════════════════════════════════════════════════
# mqtt_mssn_bridge 配置：MQTT 远程控制导航服务 / 引导动作 / 拦截模式
# ═══════════════════════════════════════════════════════════════

mqtt:
  host: 192.168.70.62
  port: 1883
  qos: 0
  keepalive_s: 30

  # ── 命令话题（节点订阅，载荷为 JSON） ──
  nav_cmd_topic: aoa/ai_guide/nav/cmd          # {"start": true}  启动/停止 uav_guide.launch
  guide_cmd_topic: aoa/ai_guide/guide/cmd      # {"start": true}  启动/停止 mqtt_waypoint_bridge
  mode_cmd_topic: aoa/ai_guide/guide/mode_cmd  # {"mode": "head-on"} | {"mode": "tail"}

  # ── 状态话题（节点发布，载荷为 JSON，默认 2Hz） ──
  nav_status_topic: aoa/ai_guide/nav/status          # {"running": true}  导航服务是否运行
  guide_status_topic: aoa/ai_guide/guide/status      # {"running":...,"mode":...,"tracking":...,"uav_state":{...},"target_state":{...}}
  planedpath_topic: aoa/ai_guide/guide/planedpath    # {"planedPath": [[x,y,z,yaw,pitch,curvature], ...]}

mssn:
  # 启动子进程前的 ROS 环境（按实际路径修改）
  setup_shell: |
    source /opt/ros/noetic/setup.bash
    source ~/catkin_ws/devel/setup.bash

  launch_package: uav_guide
  launch_file: uav_guide.launch
  launch_match: "uav_guide.launch"          # pgrep 匹配，检测是否运行
  waypoint_match: "mqtt_waypoint_bridge"    # pgrep 匹配，检测是否运行
  log_dir: ~/.ros/mqtt_mssn_bridge/logs

  launch_startup_timeout_s: 30
  waypoint_startup_timeout_s: 15
  status_poll_hz: 2.0

  # 收到模式切换命令时是否先确保导航服务已启动（沿用原 Python 行为）
  ensure_nav_on_mode: true
