mqtt:
  host: 192.168.70.62
  port: 1883
  keepalive_s: 30
  qos: 0
  topic_prefix: beam_dubins
  # 注意：节点读取的是 /mqtt/uav_info_topic（代码参数名），非 target_topic
  uav_info_topic: aoa/uav_center/+/uav_info

geodesy:
  origin_latitude_deg: 31.58461930
  origin_longitude_deg: 104.88313540
  origin_altitude_m: 515.0
  altitude_reference: ellipsoid

target:
  publish_tf: true
  timeout_ms: 5000
  # target 专属 MQTT broker（未设置时回退 /mqtt/host、/mqtt/port）
  mqtt_host: 192.168.70.62
  mqtt_port: 1883

own:
  # own（本机 uav）专属 MQTT broker（未设置时回退 /mqtt/host、/mqtt/port）
  mqtt_host: 192.168.70.62
  mqtt_port: 1883

bridge:
  # target/own 均从 uav_caster/uavs_information 发现（代码均用 decodeUavsInfo 解析 uavs[] 格式）
  target_uav_topic: uav_caster/uavs_information
  target_uav_filter: "3NF0"
  own_uav_topic: uav_caster/uavs_information
  own_uav_filter: "WNF0"
