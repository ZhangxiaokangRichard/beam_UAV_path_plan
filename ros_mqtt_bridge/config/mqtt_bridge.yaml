# ═══════════════════════════════════════════════════════════════
# ros_mqtt_bridge 配置（ROS2 Humble，mqtt_target_bridge）
#   - MQTT 入站话题与 1.0.1 **保持一致**（协议约定，不随版本变化）
#   - ROS 侧话题统一 aoa/ 前缀
#   - 现场实测（2026-09-18）：broker 192.168.70.62:1883 在线；
#     当前 uav_sn = "V2.4AOACRAFT-NOCONF0"（→ own；出现 SIL 目标时请改 target filter）
# ═══════════════════════════════════════════════════════════════
/**:
  ros__parameters:
    mqtt:
      host: "192.168.70.62"
      port: 1883
      qos: 0
      keepalive_s: 30
      # 协议 4.3.2：aoa/uav_center/${uav_sn}/uav_info（订阅用 + 通配，按 sn 路由）
      uav_info_topic: "aoa/uav_center/+/uav_info"

    geodesy:
      # 设置地理坐标系原点（ENU 坐标系的参考点）
      origin_latitude_deg: 31.5934765
      origin_longitude_deg: 104.9271017
      origin_altitude_m: 100.0

    target:
      publish_tf: true
      timeout_ms: 5000.0
      mqtt_host: "192.168.70.62"   # 未设置时回退 mqtt.host
      mqtt_port: 1883

    own:
      mqtt_host: "192.168.70.62"
      mqtt_port: 1883

    bridge:
      # uav / target 列表（话题名由 yaml 决定）
      target_uav_topic: "uav_caster/uavs_information"
      target_uav_filter: "SIL"      # 目标：含 SIL 的 sn；无匹配时回退列表首项（1.0.1 行为）
      own_uav_topic: "uav_caster/uavs_information"
      own_uav_filter: "NOCON"       # 现场实测 sn 为 V2.4AOACRAFT-NOCONF0

    # ── ROS 侧话题 ──
    topics:
      uav_state: "aoa/uav/state"
      target_state: "aoa/target/state"
      planed_path: "aoa/uav/planed_path"       # 出站显示通道的输入（规划路径，latched）

    # 出站显示通道（ROS → MQTT，2026-10-08 新增）：供窗口程序 / 地面站叠加显示
    #   auto/setpoint/guidance 等入站话题与出站控制指令均不变，
    #   本节只影响**对外展示**，不参与控制链路。
    display:
      enabled: true                            # false = 完全关闭出站展示
      rate_hz: 2.0                             # 本机/目标位姿上报频率
      include_geodetic: true                   # 载荷是否附带经纬高（由 ENU 反算，便于窗口直接落图）
      path_max_points: 0                       # >0 时对路径抽稀（保留首尾点）
      uav_state_topic: "aoa/ai_guide/display/uav_state"
      target_state_topic: "aoa/ai_guide/display/target_state"
      planed_path_topic: "aoa/ai_guide/display/planed_path"

    tf:
      world_frame: "map"            # 与 1.0.1 一致：map → <uav_sn>

