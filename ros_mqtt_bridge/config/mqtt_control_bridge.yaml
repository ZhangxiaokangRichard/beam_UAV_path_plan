/**:
  ros__parameters:
    mqtt:
      host: 192.168.70.62
      port: 1883
      qos: 0
      keepalive_s: 30
      # 出站话题模板：${uav_sn} 由 aoa/uav/state 的 child_frame_id 填充
      event_services_template: aoa/uav_control/${uav_sn}/event_services
      # true = 只打印不发（联调/离线测试用）
      dry_run: false

    # ── 纯翻译器：不节流、不去抖，出站频率 == 上游 ROS 话题频率 ──
    topics:
      nav_mode: aoa/uav/nav_mode      # 当前导航模式状态（auto|setpoint|guidance），latched
      setpoint: aoa/uav/setpoint       # setpoint 模式 → fly_point（5 Hz）
      guidance: aoa/uav/guidance       # guidance 模式 → set_cruise_mode + set_fly_head +
                                       #                set_fly_height（各 5 Hz）
      uav_state: aoa/uav/state         # 取 uav_sn（child_frame_id）

    # 映射表：auto → 不出网；setpoint → fly_point；guidance → 三条同频
    cmd:
      height_type: 0                   # 0 场高 / 1 绝对高度（协议 4.4.21）
      # 跃迁到巡航模式时发 1 条，true = 每次进入 guidance 只发 1 条；
      # false = 与 head/height 同频 5 Hz，兼作链路心跳。
      cruise_mode_once_per_mode: true
